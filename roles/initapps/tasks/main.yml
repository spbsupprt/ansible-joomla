---
- name: Create Joomla root directory
  ansible.builtin.file:
    path: "{{ initapps_joomla_root }}"
    state: directory
    owner: "{{ initapps_nginx_user }}"
    group: "{{ initapps_nginx_user }}"
    mode: '0755'

- name: Deploy Nginx Joomla config
  ansible.builtin.template:
    src: joomla.conf.j2
    dest: "{{ initapps_joomla_config_path }}"
    owner: root
    group: root
    mode: '0644'
  notify: Reload Nginx

- name: Create symlink for Joomla site
  ansible.builtin.file:
    src: "{{ initapps_joomla_config_path }}"
    dest: "{{ initapps_joomla_config_path }}"
    state: link
    force: true
  notify: Reload Nginx

- name: Ensure web directories have correct permissions
  ansible.builtin.file:
    path: "{{ item }}"
    owner: "{{ initapps_nginx_user }}"
    group: "{{ initapps_nginx_user }}"
    mode: '0755'
    recurse: true
  loop:
    - /var/www
    - "{{ initapps_joomla_root }}"
